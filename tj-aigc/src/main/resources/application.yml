server:
  port: 8094  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  profiles:
    active: dev
  application:
    name: aigc-service
  main:
    allow-circular-references: true # 允许循环引用
tj:
  swagger:
    enable: true
    package-path: com.tianji.aigc.controller
    title: LearnHub - AIGC接口文档
    description: 该服务包含AI相关功能
    contact-name: 传智教育·研究院
    contact-url: http://www.itcast.cn/
    contact-email: zhangzhijun@itcast.cn
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
  jdbc:
    database: tj_aigc #指定使用的数据库名
  ai:
    audio:
      type: DASHSCOPE # OPENAI / DASHSCOPE
      # 仅用于语音转写，不影响聊天和 Agent 使用的文本模型
      transcription-model: paraformer-v2
    prompt:
      system:
        chat:
          data-id: system-chat-message.txt
          group: DEFAULT_GROUP
          timeout-ms: 20000
        route-agent:
          data-id: route-agent-system-message.txt
        recommend-agent:
          data-id: recommend-agent-system-message.txt
        buy-agent:
          data-id: buy-agent-system-message.txt
        consult-agent:
          data-id: consult-agent-system-message.txt
        knowledge-agent:
          data-id: knowledge-agent-system-message.txt
        text:
          data-id: text-system-chat-message.txt
    memory:
      max: 100
      type: Redis #对话记忆存储方式，Redis / MYSQL / MongoDB
    chat-type: ROUTE # ROUTE / ENHANCE / APP
    video:
      provider: audio-service
      provider-version: v1
      config-version: video-ai-v1
      language: zh
      max-size-bytes: 536870912
      max-duration-seconds: 14400
      max-retry-count: 3
      analysis-max-chars: 60000
      material-max-chars: 20000
      request-timeout: 20m
      task-timeout: 30m
      pending-recovery-delay: 2m
      recovery-batch-size: 50
      pending-scan-interval-ms: 60000
      timeout-scan-interval-ms: 60000
      accepted-extensions:
        - mp3
        - mp4
        - mpeg
        - mpga
        - m4a
        - wav
        - webm
  ali:
    oss:
      endpoint: oss-cn-shanghai.aliyuncs.com
      access-id: ${OSS_ACCESSKEY_ID}
      access-key: ${OSS_ACCESSKEY_SECRET}
      bucket: itcast-zzj
